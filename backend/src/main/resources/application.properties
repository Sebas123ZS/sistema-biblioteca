spring.application.name=biblioteca-backend
server.port=8080

# ===== Credenciales locales (NO se suben al repositorio) =====
# Las contraseñas se leen de variables de entorno o del archivo
# backend/application-local.properties, que está en .gitignore.
# Copie application-local.properties.example, renómbrelo y complete sus datos.
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# ===== Base de datos MySQL (perfil por defecto) =====
# La base "biblioteca" se crea sola si no existe.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:biblioteca}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=America/Lima

# ===== Seguridad JWT =====
# Clave en Base64 (mínimo 256 bits) tomada de la variable JWT_SECRET.
# Si no se define, se genera una clave aleatoria al iniciar (las sesiones
# se cierran cada vez que se reinicia el servidor).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=28800000
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ===== Reglas de negocio =====
biblioteca.prestamo.dias=14
biblioteca.prestamo.max-activos=3
biblioteca.reserva.dias-retiro=3

# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html
